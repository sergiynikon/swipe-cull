name: Build unsigned iOS .ipa

# Produces a standalone Release build (JS bundle embedded, no Metro / Expo Go
# needed). It is unsigned: sign and install it on the iPhone with Sideloadly
# or AltStore using a free Apple ID. See README → "Install as a standalone app".

on:
  push:
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build Release .app without code signing
        run: |
          xcodebuild \
            -workspace ios/PhotosCleaner.xcworkspace \
            -scheme PhotosCleaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PhotosCleaner.app dist/Payload/
          cd dist && zip -qry PhotosCleaner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotosCleaner-ipa
          path: dist/PhotosCleaner.ipa
          retention-days: 30
